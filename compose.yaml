services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vibequiz
      POSTGRES_PASSWORD: vibequiz
      POSTGRES_DB: vibequiz
    ports:
      - "5432:5432"
    volumes:
      - vibequiz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibequiz -d vibequiz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: vibequiz
      POSTGRES_PASSWORD: vibequiz
      POSTGRES_DB: vibequiz_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibequiz -d vibequiz_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  vibequiz_postgres_data:
